<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 영어 쓰기 (Today's English Writing)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  color-scheme: light;
  --sky: #E6F1F8;
  --paper: #FFFFFF;
  --ink: #1F3B63;
  --ink-soft: #2F4568;
  --rule: #C4DCEE;
  --margin: #EE8C8C;
  --pencil: #FFC83D;
  --pencil-dark: #D9A21A;
  --leaf: #2C9463;
  --leaf-soft: #E3F4EA;
  --red: #CF3434;
  --red-soft: #FDECEC;
  --shade: #F3F7FB;
  --font-ko: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-head: "Jua", "Gowun Dodum", "Malgun Gothic", system-ui, sans-serif;
  --font-en: "Andika", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--sky); color: var(--ink);
  font-family: var(--font-ko); font-size: 17px; line-height: 1.55;
}
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.2rem; }
p { margin: 0 0 .8em; }
a { color: var(--ink); }
.en { font-family: var(--font-en); }
.wrap { max-width: 1360px; margin: 0 auto; padding: 14px 24px 40px; }
.muted { color: var(--ink-soft); font-size: .95rem; }
.small { font-size: .9rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 200px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.hidden { display: none !important; }

/* 판·카드 */
.panel { background: var(--paper); border-radius: 18px; padding: 18px 20px; margin-bottom: 16px; border: 2px solid #D5E5F1; }
.cols { display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; gap: 16px; align-items: start; }
.cols.even { grid-template-columns: 1fr 1fr; }
.cols > * { min-width: 0; }
.badge { display: inline-block; font-size: .85rem; border-radius: 999px; padding: 1px 10px; background: var(--shade); border: 1.5px solid #C9DAE8; color: var(--ink); }
.badge.self { background: #E3F4EA; border-color: #9FD3B7; }
.badge.slow { background: #FFF1C4; border-color: #E9C766; }
.badge.off { background: #F1F1F1; border-color: #CCC; }
.stepnum { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font-family: var(--font-head); margin-right: 6px; font-size: 1rem; }
.w { background: none; border: 0; padding: 0 1px; margin: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 4px; }
.w:hover, .w:focus-visible { background: #FFF1C4; }
#wordtip { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: #fff; border: 3px solid var(--pencil-dark); border-radius: 14px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(31,59,99,.2); max-width: 340px; }
.split { display: grid; gap: 20px; align-items: start; }
.split.wide { grid-template-columns: minmax(0, 7fr) minmax(280px, 3fr); }
.split.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.split > * { min-width: 0; }
.helper { background: var(--shade); border-radius: 14px; padding: 14px 16px; }
.keycheck { background: #FFF6D8; border: 2px solid #F0D27A; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.kc { display: inline-flex; flex-direction: column; background: #fff; border: 2px solid #E3D29A; border-radius: 12px; padding: 6px 12px; font-size: 1.05rem; }
.kc small { font-size: .85rem; color: var(--ink-soft); }
.kc.ok { border-color: var(--leaf); background: var(--leaf-soft); }
.sentgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); column-gap: 28px; margin-top: 6px; }
.panel.locked { opacity: .6; }
.panel.locked h3 .stepnum { background: var(--ink-soft); }
@media (max-width: 900px) { .split.wide, .split.half { grid-template-columns: 1fr; } .sentgrid { grid-template-columns: 1fr; } }
.navgroups { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end; margin-bottom: 12px; }
.ng { display: flex; flex-direction: column; gap: 4px; }
.ng + .ng { padding-left: 28px; border-left: 3px solid #D5E5F1; }
.ng .tabs { margin: 0; }
.ng-label { font-family: var(--font-head); font-size: .9rem; color: var(--ink-soft); }
.classbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fff; border: 2px solid #D5E5F1; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
.classbar .ng-label { margin-right: 6px; }
.cb { font-family: var(--font-head); font-size: 1.05rem; background: var(--shade); border: 2px solid #C9DAE8; border-radius: 12px; padding: 6px 14px; cursor: pointer; color: var(--ink); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }
.cb small { font-family: var(--font-ko); font-size: .75rem; color: var(--ink-soft); }
.cb.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.cb.on small { color: #DDE7F2; }
.rangepick { display: grid; gap: 8px; justify-items: start; }
.rp-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--shade); border-radius: 12px; padding: 8px 12px; }
.rp-row select { width: auto; font-size: 1.1rem; padding: 6px 10px; }
.rp-count { font-family: var(--font-head); background: #fff; border-radius: 999px; padding: 2px 12px; border: 2px solid #C9DAE8; }
.rp-prev { margin: 10px 0 4px; padding: 10px 14px; border: 2px dashed #C9DAE8; border-radius: 12px; }
.rp-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 2px 0; }
.rp-line b { font-family: var(--font-head); font-weight: 400; min-width: 56px; }
.gradepick { display: grid; gap: 6px; }
.gradepick .gr { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 6px 10px; border: 1.5px solid #E1EBF3; border-radius: 10px; }
.gradepick .gr b { font-family: var(--font-head); font-weight: 400; min-width: 52px; }
.gradepick label { font-family: var(--font-ko); font-size: .95rem; display: inline-flex; gap: 4px; align-items: center; margin: 0; }
.unitlist button { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: #fff; border: 2px solid #D5E5F1; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.unitlist button.on { border-color: var(--ink); background: #F2F8FD; }
.panel.flat { border-style: dashed; background: transparent; }
.note { background: #FFF6D8; border-left: 6px solid var(--pencil); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.alert { background: var(--red-soft); border-left: 6px solid var(--red); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.ok { background: var(--leaf-soft); border-left: 6px solid var(--leaf); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }

/* 입력 */
label { display: block; font-family: var(--font-head); font-size: 1.05rem; margin: 12px 0 4px; }
input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: #fff;
  border: 2px solid #BFD3E4; border-radius: 12px; padding: 10px 14px;
}
textarea { resize: vertical; min-height: 90px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(255, 200, 61, .6); }
:focus-visible { outline: 3px solid var(--pencil-dark); outline-offset: 2px; }

/* 버튼: 눌리는 키보드 키처럼 */
.btn {
  font-family: var(--font-head); font-size: 1.05rem; color: var(--ink); cursor: pointer;
  background: var(--pencil); border: 0; border-bottom: 4px solid var(--pencil-dark);
  border-radius: 12px; padding: 10px 18px; display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none; transition: transform .05s;
}
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.ghost { background: #fff; border: 2px solid #BFD3E4; border-bottom-width: 4px; }
.btn.green { background: var(--leaf); color: #fff; border-bottom-color: #1E6E48; }
.btn.red { background: #fff; color: var(--red); border: 2px solid #F0B9B9; border-bottom-width: 4px; }
.btn.big { font-size: 1.3rem; padding: 14px 26px; }
.btn.sm { font-size: .9rem; padding: 6px 12px; border-bottom-width: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { background: none; border: 0; cursor: pointer; font-size: 1.2rem; padding: 2px 6px; border-radius: 8px; }
.iconbtn:hover { background: var(--shade); }

/* 칩 */
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-en); font-size: 1rem;
  background: #fff; border: 2px solid #BFD3E4; border-radius: 999px; padding: 4px 14px; margin: 3px; cursor: pointer; color: var(--ink);
}
.chip:hover { border-color: var(--ink); }
.chip.key { background: #FFF1C4; border-color: var(--pencil-dark); }

/* 머리 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { font-family: var(--font-head); font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
.who { font-size: .95rem; background: #fff; border-radius: 999px; padding: 4px 14px; border: 2px solid #D5E5F1; }

/* 단계 길: 연필 선 위의 다섯 칸 */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 2px 0 12px; position: relative; }
.steps::before { content: ""; position: absolute; left: 6%; right: 6%; top: 20px; height: 6px; background: repeating-linear-gradient(90deg, var(--pencil) 0 18px, transparent 18px 26px); border-radius: 3px; z-index: 0; }
.step { position: relative; z-index: 1; background: none; border: 0; cursor: pointer; font-family: var(--font-head); color: var(--ink-soft); font-size: 1rem; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; }
.step .dot { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 3px solid #BFD3E4; display: grid; place-items: center; font-size: 1.5rem; }
.step.on { color: var(--ink); }
.step.on .dot { border-color: var(--ink); background: var(--pencil); transform: scale(1.08); }

/* 공책 종이 — 이 앱의 얼굴 */
.paper {
  font-family: var(--font-en); font-size: 1.35rem; line-height: 2.4rem; color: #1A2E4F;
  background-color: #FFFEF9;
  background-image:
    linear-gradient(90deg, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(2.4rem - 2px), var(--rule) calc(2.4rem - 2px), var(--rule) 2.4rem);
  background-attachment: local;
  border: 2px solid #CBDDEB; border-radius: 16px; padding: 0 20px 0 70px; min-height: calc(2.4rem * 7 + 4px);
  width: 100%; resize: vertical; margin: 0;
}
textarea.paper:focus { border-color: var(--ink); }
.paper-read { font-family: var(--font-en); font-size: 1.2rem; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }

/* 대화 */
.chatbox { display: flex; flex-direction: column; gap: 10px; height: 52vh; min-height: 300px; overflow-y: auto; padding: 6px 2px 10px; }
.bubble { max-width: 82%; padding: 12px 16px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; font-size: 1.05rem; }
.bubble.ai { background: var(--shade); border: 2px solid #D5E5F1; align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.me { background: #FFF1C4; align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble .en { font-size: 1.1rem; }

/* 빈칸 문장 */
.sent { padding: 10px 0; border-bottom: 2px dashed #DCE8F2; }
.sent .en { font-size: 1.25rem; line-height: 2.2; }
.sent input { width: auto; min-width: 90px; display: inline-block; font-family: var(--font-en); font-size: 1.15rem; padding: 2px 10px; border-width: 0 0 3px 0; border-radius: 0; border-color: var(--pencil-dark); background: #FFFBEA; }

/* 따라 쓰기 */
.target { font-family: var(--font-en); font-size: 1.2rem; line-height: 1.9; background: var(--shade); border-radius: 12px; padding: 12px 16px; white-space: pre-wrap; }
.target .done { color: var(--leaf); }
.target .bad { background: var(--red-soft); color: var(--red); text-decoration: underline wavy; }
.bar { height: 14px; background: #E1EBF3; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .2s; }

/* 첨삭 */
.good { font-weight: 700; color: #122A4D; background: #E7F0FF; border-radius: 4px; padding: 0 2px; }
.fix { font-weight: 700; color: var(--red); }
.fix s { opacity: .75; }
.grade { display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; font-family: var(--font-head); font-size: 1.6rem; border: 4px solid; }
.grade.g상 { color: var(--leaf); border-color: var(--leaf); }
.grade.g중 { color: var(--pencil-dark); border-color: var(--pencil-dark); }
.grade.g하 { color: var(--ink-soft); border-color: var(--ink-soft); }

/* 갤러리 */
.gallery { columns: 4 250px; column-gap: 14px; }
.card { break-inside: avoid; background: #fff; border-radius: 16px; border: 2px solid #D5E5F1; margin-bottom: 16px; overflow: hidden; }
.card.mine { border-color: var(--pencil-dark); }
.card img { width: 100%; display: block; }
.card .body { padding: 14px 16px; }
.heart { background: none; border: 2px solid #F3C4CC; border-radius: 999px; padding: 2px 12px; cursor: pointer; font: inherit; font-size: .95rem; }
.heart.on { background: #FFE3E8; border-color: #E87C92; }
.credit { font-size: .82rem; color: var(--ink-soft); padding: 4px 16px 0; }

/* 사진 */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.photos button { padding: 0; border: 3px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; background: none; aspect-ratio: 4/3; }
.photos button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos button:hover { border-color: var(--pencil-dark); }
.drop { border: 3px dashed #BFD3E4; border-radius: 14px; padding: 18px; text-align: center; background: #FBFDFF; }
.drop:focus { border-color: var(--ink); }
.pick { display: flex; gap: 14px; align-items: center; }
.pick img { width: 160px; border-radius: 10px; }

/* 탭(교사·관리자) */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { font-family: var(--font-head); font-size: 1rem; background: #fff; border: 2px solid #D5E5F1; border-radius: 12px; padding: 8px 14px; cursor: pointer; color: var(--ink-soft); }
.tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.subtabs .tab { font-size: .92rem; padding: 6px 12px; }
.subtabs .tab.on { background: var(--pencil); color: var(--ink); border-color: var(--pencil-dark); }

table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid #E1EBF3; vertical-align: top; }
th { font-family: var(--font-head); font-weight: 400; background: var(--shade); }
.scroll { overflow-x: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: #fff; border: 2px solid #D5E5F1; border-radius: 14px; padding: 12px 14px; }
.tile b { font-family: var(--font-head); font-size: 1.7rem; font-weight: 400; display: block; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 6px; }
.bars div { flex: 1; background: var(--ink); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.bars div span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: .75rem; color: var(--ink-soft); white-space: nowrap; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { font-family: var(--font-ko); font-size: .95rem; display: inline-flex; gap: 6px; align-items: center; margin: 0; }
details summary { cursor: pointer; font-family: var(--font-head); }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
#toast div { background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; box-shadow: 0 6px 20px rgba(31, 59, 99, .25); max-width: 90vw; }
#toast div.err { background: var(--red); }
.spin { display: inline-block; width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; }
@keyframes sp { to { transform: rotate(360deg); } }
footer { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 6px 0 20px; }

/* 입장 화면 */
.enter { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; min-height: 80vh; }
.enter .eyebrow { font-family: var(--font-en); font-weight: 700; letter-spacing: .12em; font-size: 1rem; color: var(--pencil-dark); margin: 0 0 6px; }
.enter .hello { font-family: var(--font-head); font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1.15; margin: 0; }
.enter .hello-en { font-family: var(--font-en); font-size: clamp(1.2rem, 2.4vw, 1.6rem); margin: 4px 0 18px; }
.enter .tagline { font-size: 1.25rem; padding: 10px 16px; background: #fff; border-left: 6px solid var(--pencil); border-radius: 10px; display: inline-block; }
.enter .hello span { display: block; }
.enter .lined { background-image: repeating-linear-gradient(180deg, transparent 0 calc(1.1em - 3px), var(--rule) calc(1.1em - 3px) 1.1em); }

@media (max-width: 980px) { .cols, .cols.even { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  body { font-size: 17px; }
  .enter { grid-template-columns: 1fr; min-height: 0; }
  .step .dot { width: 44px; height: 44px; font-size: 1.2rem; }
  .steps::before { top: 19px; }
  .step small { font-size: .72rem; }
  .paper { padding-left: 46px; background-image:
    linear-gradient(90deg, transparent 32px, var(--margin) 32px, var(--margin) 34px, transparent 34px),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(2.4rem - 2px), var(--rule) calc(2.4rem - 2px), var(--rule) 2.4rem); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .noprint { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="wordtip" class="hidden" role="status"></div>
<footer class="noprint">오늘의 영어 쓰기 &nbsp;|&nbsp; 만든 사람 Tr. Olivia</footer>
<script>
// =====================================================================
// ★ 설정 — 여기 두 줄만 내 Supabase 값으로 바꾸면 됩니다 ★
// Supabase > Project Settings > API Keys 에서 복사
// (anon / publishable 키는 공개되어도 되는 키입니다. service_role / secret 키는 절대 여기에 넣지 마세요!)
// =====================================================================
const CONFIG = {
  SUPABASE_URL: 'https://kpjbzvcvbhuakevhyruz.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwamJ6dmN2Ymh1YWtldmh5cnV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODU3MzYsImV4cCI6MjEwNDk2MTczNn0.sVPiDgDuEj1-fQjPy1qD4em37uXX4cJYpXlEnHGqH1Q',
  API: '/.netlify/functions/api',
  MAX_CHAT: 6,            // 대화 턴 수
  MAX_RESET: 1,           // '처음부터 다시 하기' 횟수
  MAX_FEEDBACK_PER_DAY: 3 // 하루 첨삭 횟수
};

// ---------- 공통 도구 ----------
const $ = (s) => document.querySelector(s);
const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = (s) => esc(s).replace(/\n/g, '&#10;');

const nlList = (s) => String(s || '').split('\n').map((x) => x.trim()).filter(Boolean);
const wordList = (s) => String(s || '').split(/\n|,/).map((x) => x.trim()).filter(Boolean).map(parseWord);
function parseWord(line) {
  const m = line.match(/^(.+?)\s+-\s+(.+)$/) || line.match(/^(.+?)\s*[:=]\s*(.+)$/);
  return m ? { word: m[1].trim(), meaning: m[2].trim() } : { word: line, meaning: '' };
}

const LS = {

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const SS = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },

function toast(msg, isErr) {

let sb = null;
function db() {
  if (sb) return sb;
  if (!window.supabase || CONFIG.SUPABASE_URL.includes('여기에')) throw new Error('index.html 맨 위 CONFIG에 Supabase 주소와 키를 넣어 주세요.');
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  return sb;
}
async function rpc(name, args) {
  const { data, error } = await db().rpc(name, args);
  if (error) throw new Error(error.message || '저장소 오류가 났어요.');
  return data;
}
async function callApi(action, payload) {
  const r = await fetch(CONFIG.API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...payload }) });
  let d = {};
  try { d = await r.json(); } catch { throw new Error(`서버에 연결하지 못했어요 (${r.status}).`); }
  if (!r.ok) throw new Error(d.error || `서버 오류 (${r.status})`);
  return d;
}

// 버튼을 누르는 동안 '잠깐만요' 표시
async function busy(btn, fn) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 잠깐만요'; }
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

// ---------- 소리로 듣기 ----------
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('이 기기에서는 듣기를 쓸 수 없어요.', true); return; }
  speechSynthesis.cancel();
  const clean = plain(text)
    .replace(/\([^)]*[\u3131-\uD79D][^)]*\)/g, ' ') // 한국어 도움말 괄호는 읽지 않기
    .replace(/[\u3131-\uD79D]+/g, ' ')
    .replace(/_{2,}/g, 'blank');
  if (!clean.trim()) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find((x) => /en-US/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const sayBtn = (text) => `<button class="iconbtn" title="듣기" aria-label="듣기" onclick="speak(this.dataset.t)" data-t="${attr(text)}">🔊</button>`;

// ---------- 사진 ----------
async function compressImage(file) {
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('그림 파일을 열 수 없어요.'));
    i.src = URL.createObjectURL(file);
  });
  let w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(1, 1200 / Math.max(w, h));
  w = Math.round(w * scale); h = Math.round(h * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  let q = 0.85, blob;
  for (;;) {
    blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
    if (blob.size <= 300 * 1024 || q <= 0.35) break;
    q -= 0.1;
  }
  if (blob.size > 300 * 1024) { // 그래도 크면 크기를 줄여서 한 번 더
    const c2 = document.createElement('canvas'); c2.width = Math.round(w * 0.7); c2.height = Math.round(h * 0.7);
    c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height);
    blob = await new Promise((r) => c2.toBlob(r, 'image/jpeg', 0.6));
  }
  return blob;
}
function folderOf(code) { // 한글 학급 코드를 저장소용 영문 폴더명으로
  let h = 0; for (const ch of code) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return 'c' + h.toString(36);
}
async function uploadPhoto(code, no, blob) {
  const path = `${folderOf(code)}/${no}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
  const { error } = await db().storage.from('student-photos').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw new Error('사진을 올리지 못했어요: ' + error.message);
  return path;
}
async function signedUrls(items) {
  const paths = [...new Set(items.map((x) => x.photo_path).filter(Boolean))];
  if (!paths.length) return {};
  const { data } = await db().storage.from('student-photos').createSignedUrls(paths, 3600);
  const map = {};
  (data || []).forEach((d) => { if (d.signedUrl) map[d.path] = d.signedUrl; });
  return map;
}
function photoHtml(x, urls) {
  if (x.photo_path && urls[x.photo_path]) return `<img src="${attr(urls[x.photo_path])}" alt="학생이 올린 사진" loading="lazy">`;
  if (x.photo_url) return `<img src="${attr(x.photo_url)}" alt="" loading="lazy"><div class="credit">Photo by <a href="${attr(x.photo_credit_link || 'https://unsplash.com')}" target="_blank" rel="noopener">${esc(x.photo_credit || 'Unsplash')}</a> on <a href="https://unsplash.com/?utm_source=english_writing_class&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a></div>`;
  return '';
}

// 둥근 따옴표·긴 대시처럼 키보드로 치기 어려운 글자를 보통 글자로
function plain(s) {
  return String(s || '')
    .replace(/[\u2018\u2019\u201A\u2032\u02BC\u0060\u00B4]/g, "'")
    .replace(/[\u201C\u201D\u201E\u2033]/g, '"')
    .replace(/[\u2013\u2014\u2212]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/[\u00A0\u2007\u202F\u200B]/g, ' ');
}
function annotatedHtml(s) {
  return esc(s)
    .replace(/\[\[good:([\s\S]*?)\]\]/g, '<strong class="good">$1</strong>')
    .replace(/\[\[fix:([\s\S]*?)=&gt;([\s\S]*?)\]\]/g, '<strong class="fix"><s>$1</s> → $2</strong>')
    .replace(/\[\[fix:([\s\S]*?)\]\]/g, '<strong class="fix">$1</strong>');
}
// opt.grade: 교사 화면에서만 넘김 / opt.rewrite: 고쳐 쓴 글 보이기

function wordify(text) {
  return String(text || '').split(/([A-Za-z][A-Za-z'\u2019-]*)/)
    .map((part, i) => i % 2 ? `<button type="button" class="w" data-w="${attr(part)}">${esc(part)}</button>` : esc(part)).join('');
}
const _defs = {};
let _tipTimer = null;
function showTip(html) {
  const t = $('#wordtip'); t.innerHTML = html; t.classList.remove('hidden');
  clearTimeout(_tipTimer); _tipTimer = setTimeout(() => t.classList.add('hidden'), 7000);
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('.w'); if (!b || !St.me) return;
  const word = b.dataset.w.replace(/[\u2019]/g, "'").replace(/^'+|'+$/g, '');
  const key = word.toLowerCase();
  const head = `<div class="row" style="flex-wrap:nowrap"><b class="en grow" style="font-size:1.3rem">${esc(word)}</b>${sayBtn(word)}<button class="iconbtn" aria-label="닫기" onclick="$('#wordtip').classList.add('hidden')">✕</button></div>`;
  if (_defs[key]) { showTip(head + `<div>${esc(_defs[key])}</div>`); return; }
  showTip(head + '<div><span class="spin"></span> 뜻을 찾는 중…</div>');
  try {
    const ctx = b.closest('[data-ctx]')?.textContent || '';
    const r = await callApi('define', { ...St.creds(), word, context: ctx });
    _defs[key] = r.meaning || '뜻을 찾지 못했어요';
    showTip(head + `<div>${esc(_defs[key])}</div>`);
  } catch (err) { showTip(head + `<div class="fix">${esc(err.message)}</div>`); }
});

function csvDownload(filename, rows) {
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const text = '\uFEFF' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

      .catch((e) => { const b = $('#aiWords'); if (b) b.innerHTML = `<p class="alert">${esc(e.message)}</p>`; document.querySelectorAll('.ko-tr').forEach((x) => { x.textContent = ''; }); });
  },
  async reloadAi(btn) {
    await busy(btn, async () => { LS.del(this.k('aiWords')); await this.ensureAi(); this.drawAiWords(); this.redrawRef(); });
  },
  drawAiWords() {
    const box = $('#aiWords'); if (!box) return;
    const list = this.aiData()?.words || [];
    box.innerHTML = list.map((w) => `<div style="padding:8px 0;border-bottom:2px dashed #DCE8F2">
      <div class="row" style="gap:4px"><b class="en" style="font-size:1.25rem">${esc(w.word)}</b> <span>${esc(w.meaning)}</span>${sayBtn(w.word)}</div>
      <div class="en">${esc(w.example)} ${sayBtn(w.example)}</div></div>`).join('') || '<p>단어가 없어요.</p>';
  },

  // ---------- 2. 대화 ----------
  chatHist() { return LS.get(this.k('chat'), []); },
  renderChat(v) {
    const resets = LS.get(this.k('resets'), 0);
    v.innerHTML = `
    <div class="cols" style="grid-template-columns:7fr 4fr">
      <section class="panel">
        <div class="row"><h2 class="grow" style="margin:0">💬 AI와 이야기하며 글감 모으기</h2><span class="who">남은 대답 <b id="chatLeft"></b> / ${CONFIG.MAX_CHAT}</span></div>
        <p class="small">영어로 대답해 봐요. 어려우면 한국어로 대답해도 영어로 어떻게 말하는지 알려 줘요.</p>
        <div class="chatbox" id="chatbox" aria-live="polite"></div>
        <div id="chatInput"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost sm" onclick="St.resetChat()" ${resets >= CONFIG.MAX_RESET ? 'disabled' : ''}>처음부터 다시 하기 (남은 기회 ${Math.max(0, CONFIG.MAX_RESET - resets)})</button>
        </div>
      </section>
      <div>
        <section class="panel"><p class="small" style="margin:0">오늘의 주제</p><h3 style="margin:0">${esc(this.cls.topic || '')}</h3></section>
        ${this.refPanel(false)}
      </div>
    </div>`;
    this.fillKo();
    this.drawChat();
    if (!this.chatHist().length) this.chatStart();
  },
  drawChat(pending) {
    const box = $('#chatbox'); if (!box) return;
    const h = this.chatHist();
    const left = CONFIG.MAX_CHAT - h.filter((m) => m.role === 'user').length;
    box.innerHTML = h.map((m) => m.role === 'user'
      ? `<div class="bubble me">${esc(m.text)}</div>`
      : `<div class="bubble ai"><span class="en">${esc(m.text)}</span> ${sayBtn(m.text)}</div>`).join('')
      + (pending ? '<div class="bubble ai"><span class="spin"></span> 생각하는 중…</div>' : '')
      + (!pending && this._chatErr ? `<div class="alert">${esc(this._chatErr)} <button class="btn sm" onclick="St.chatRetry()">다시 시도</button></div>` : '');
    box.scrollTop = box.scrollHeight;
    $('#chatLeft').textContent = Math.max(0, left);
    const inp = $('#chatInput');
    if (left <= 0) {
      inp.innerHTML = `<div class="ok">대화를 모두 마쳤어요! 이 이야기로 글을 써 봐요. <button class="btn" onclick="St.go('write')">✏️ 쓰기로 가기</button></div>`;
    } else if (!$('#chatText')) {
      inp.innerHTML = `<div class="row" style="align-items:flex-end"><textarea id="chatText" class="grow" rows="2" placeholder="여기에 대답을 적어요 (Enter로 보내기)" onkeydown="St.chatKey(event)"></textarea>
        <button class="btn" id="chatSend" onclick="St.send()">보내기</button></div>`;
    }
    const send = $('#chatSend'); if (send) send.disabled = !!pending;
  },
  chatKey(e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.send(); } },
  async chatStart() {
    if (this._chatBusy) return;
    this._chatBusy = true; this._chatErr = ''; this.drawChat(true);
    try {
      const r = await callApi('chat', { ...this.creds(), history: [], start: true });
      LS.set(this.k('chat'), [{ role: 'model', text: r.reply }]);
    } catch (e) { this._chatErr = e.message; this._retry = 'start'; }
    this._chatBusy = false; this.drawChat();
  },
  async send() {
    const ta = $('#chatText'); if (!ta || this._chatBusy) return;
    const text = ta.value.trim(); if (!text) return;
    const h = this.chatHist();
    if (h.filter((m) => m.role === 'user').length >= CONFIG.MAX_CHAT) return;
    h.push({ role: 'user', text }); LS.set(this.k('chat'), h); ta.value = '';
    await this.chatReply();
  },
  async chatReply() {
    this._chatBusy = true; this._chatErr = ''; this.drawChat(true);
    const h = this.chatHist();
    try {
      const r = await callApi('chat', { ...this.creds(), history: h });
      h.push({ role: 'model', text: r.reply }); LS.set(this.k('chat'), h);
    } catch (e) { this._chatErr = e.message; this._retry = 'reply'; }
    this._chatBusy = false; this.drawChat();
  },
  chatRetry() { this._retry === 'start' ? this.chatStart() : this.chatReply(); },
  resetChat() {
    const resets = LS.get(this.k('resets'), 0);
    if (resets >= CONFIG.MAX_RESET) return;
    if (!confirm('지금까지 나눈 대화가 지워지고 새로 시작해요. 다시 하기는 한 번만 할 수 있어요. 할까요?')) return;
    LS.set(this.k('resets'), resets + 1); LS.del(this.k('chat'));
    this.renderChat($('#view'));
  },

  // ---------- 3. 쓰기 ----------
  // '천천히 쓰기'와 '바로 쓰기'는 초안·첨삭·완성 글·게시가 모두 따로 저장돼요.
  km(s) { return this.k(`${this.mode}:${s}`); },
  kDay() { return `ew:${this.me.class_code}:${this.me.no}:fb:${this.mode}:${today()}`; },
  setMode(m) { this.mode = m; LS.set(this.k('mode'), m); this._tgt = null; this.renderWrite($('#view')); window.scrollTo(0, 0); },
  num(i) { return i + (this.mode === 'slow' ? 1 : 0); }, // 천천히 쓰기는 1번(예시 문장)이 하나 더 있어요

  renderWrite(v) {
    if (!this.mode) {
      v.innerHTML = `<section class="panel"><h2>어떻게 써 볼까요?</h2>
        <div class="grid2">
          <button class="panel" style="cursor:pointer;text-align:left;font:inherit;color:inherit;margin:0" onclick="St.setMode('self')">
            <h2>🚀 내가 바로 영어로 쓰기</h2><p>모르는 단어만 찾아보면서 내 힘으로 직접 써요. 스스로 영어로 글을 지어 보는 연습이에요.</p></button>
          <button class="panel" style="cursor:pointer;text-align:left;font:inherit;color:inherit;margin:0" onclick="St.setMode('slow')">
            <h2>🐢 천천히 만들면서 쓰기</h2><p>대화에서 내가 한 말로 빈칸 문장을 만들어 줘요. 빈칸을 채우면서 글을 완성해요.</p></button>
        </div>
        <p class="small">두 방법은 서로 따로 저장되고, 첨삭도 따로 받아요.</p></section>`;
      return;
    }
    const slow = this.mode === 'slow';
    v.innerHTML = `
    <section class="panel row" style="padding:10px 18px">
      <h2 class="grow" style="margin:0">${slow ? '🐢 천천히 만들면서 쓰기' : '🚀 내가 바로 영어로 쓰기'}</h2>
      <span class="small">${slow ? '빈칸 문장으로 차근차근 글을 만들어요.' : '내 힘으로 스스로 영어 글을 지어 봐요.'} 두 방법의 글과 첨삭은 따로 저장돼요.</span>
      <button class="btn ghost sm" onclick="St.setMode('${slow ? 'self' : 'slow'}')">${slow ? '🚀 바로 쓰기로' : '🐢 천천히 쓰기로'} 바꾸기</button>
    </section>
    ${slow ? `<section class="panel">
      <div class="row"><h3 class="grow" style="margin:0"><span class="stepnum">1</span>대화로 예시 문장 만들기</h3>
        <button class="btn" onclick="St.makeHints(this)">✨ 예시 문장 만들기</button></div>
      <p class="small" style="margin:6px 0 0">AI가 대화에서 내가 말한 내용으로 빈칸(____) 문장을 만들어 줘요. 빈칸을 내 말로 채운 다음 초안에 담아요.</p>
      <div id="sents"></div>
    </section>` : ''}
    <section class="panel">
      <h3><span class="stepnum">${this.num(1)}</span>초안 쓰기</h3>
      ${slow ? '' : '<div id="keyCheck" class="keycheck"></div>'}
      <div class="split wide">
        <div>
          <textarea id="paper" class="paper" spellcheck="false" autocomplete="off" oninput="St.onDraft()" placeholder="Write here…" aria-label="나의 초안">${esc(LS.get(this.k(this.draftKey()), ''))}</textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn ghost sm" onclick="speak($('#paper').value)">🔊 내 글 듣기</button>
            <span class="grow"></span>
            <span class="small" id="fbLeft"></span>
            <button class="btn green" id="fbBtn" onclick="St.askFeedback(this)">✏️ 첨삭 받기</button>
          </div>
        </div>
        <div class="helper">
          <h3 style="margin-bottom:4px">🔎 모르는 단어 찾기</h3>
          <p class="small">한국어로 찾아봐요. 몇 번이든 찾을 수 있어요. 찾은 단어는 보고 직접 써요.</p>
          <div class="row"><input type="search" id="lk" class="grow" placeholder="예: 체육, 맛있다, 인형뽑기" onkeydown="if(event.key==='Enter'&&!event.isComposing)St.lookup()">
            <button class="btn" id="lkBtn" onclick="St.lookup()">찾기</button></div>
          <div id="lkOut"></div>
        </div>
      </div>
    </section>
    <section class="panel" id="secFb"></section>
    <section class="panel" id="secFinal"></section>
    <section class="panel" id="secTyping"></section>
    <section class="panel" id="secPost"></section>`;
    if (slow) this.drawSents();
    else { this.drawKeyCheck(); this.fillKo(); }
    this.drawFbLeft(); this.drawAfter();
  },

  onDraft() { LS.set(this.k(this.draftKey()), $('#paper').value); this.drawKeyCheck(); },
  drawKeyCheck() {
    const el = $('#keyCheck'); if (!el) return;
    const keys = nlList(this.cls.key_expressions);
    if (!keys.length) { el.remove(); return; }
    const lower = typeNorm($('#paper').value).toLowerCase();
    const ko = this.aiData()?.key_ko || [];
    el.innerHTML = `<b>⭐ 핵심 표현이 내 글에 들어갔나요?</b>
      <div class="row" style="gap:8px;margin-top:6px">${keys.map((k, i) => {
        const fixed = typeNorm(k.split(/\([^)]*\)/)[0]).replace(/[.!?]/g, '').trim().toLowerCase();
        const ok = !!lower && (!fixed || lower.includes(fixed));
        return `<span class="kc ${ok ? 'ok' : ''}"><span>${ok ? '✅' : '⬜'} <span class="en">${esc(k)}</span></span>${ko[i] ? `<small>${esc(ko[i])}</small>` : ''}</span>`;
      }).join('')}</div>`;
  },
  drawFbLeft() {
    const el = $('#fbLeft'); if (!el) return;
    const left = Math.max(0, CONFIG.MAX_FEEDBACK_PER_DAY - LS.get(this.kDay(), 0));
    el.textContent = `오늘 첨삭 남은 횟수 ${left} / ${CONFIG.MAX_FEEDBACK_PER_DAY}`;
    $('#fbBtn').disabled = left <= 0;
  },

  // 빈칸 문장 (천천히 쓰기)
  async makeHints(btn) {
    const cur = LS.get(this.k('hints'));
    if (cur && cur.sentences?.length && !confirm('새 예시 문장을 만들면 지금 채운 빈칸은 사라져요. 만들까요?')) return;
    await busy(btn, async () => {
      try {
        const r = await callApi('hint', { ...this.creds(), history: this.chatHist() });
        if (!r.sentences?.length) throw new Error('empty');
        LS.set(this.k('hints'), { sentences: r.sentences, values: r.sentences.map(() => []) });
      } catch {
        LS.set(this.k('hints'), this.fallbackHints());
        toast('AI가 바빠서 기본 예시 문장을 보여 줄게요.');
      }
      this.drawSents();
    });
  },
  fallbackHints() {
    const stop = new Set(['the', 'and', 'you', 'are', 'was', 'what', 'because', 'like', 'this', 'that', 'with', 'have', 'very']);
    const said = this.chatHist().filter((m) => m.role === 'user').map((m) => m.text).join(' ');
    const words = [...new Set((said.match(/[A-Za-z]{3,}/g) || []).map((w) => w.toLowerCase()).filter((w) => !stop.has(w)))].slice(0, 12);
    const fromKeys = nlList(this.cls.key_expressions).map((k) => k.replace(/\([^)]*\)/g, '____'));
    const sentences = [...fromKeys, 'I like ____.', 'It is ____.', 'I feel ____.'].map((t) => ({ template: t, answer: [], ko: '' }));
    return { sentences, values: sentences.map(() => []), words, fallback: true };
  },
  drawSents() {
    const box = $('#sents'); if (!box) return;
    const d = LS.get(this.k('hints'));
    if (!d || !d.sentences?.length) { box.innerHTML = ''; return; }
    box.innerHTML = `
      ${d.words?.length ? `<p class="small" style="margin:10px 0 0">대화에서 나온 낱말: ${d.words.map((w) => `<span class="chip" style="cursor:default">${esc(w)}</span>`).join('')}</p>` : ''}
      <div class="sentgrid">${d.sentences.map((s, si) => {
        const parts = s.template.split('____');
        const html = parts.map((p, bi) => esc(p) + (bi < parts.length - 1
          ? `<input type="text" data-s="${si}" data-b="${bi}" value="${attr((d.values[si] || [])[bi] || '')}" oninput="St.blank(this)" aria-label="빈칸" autocomplete="off" spellcheck="false">` : '')).join('');
        const hint = (s.answer || []).filter(Boolean).join(', ');
        return `<div class="sent"><div class="en"><b style="font-family:var(--font-head);font-weight:400;color:var(--ink-soft)">${si + 1}.</b> ${html} ${sayBtn(s.template)}</div>
          <div class="small">${esc(s.ko || '')} ${hint ? `<button class="iconbtn small" data-h="${attr(hint)}" onclick="this.replaceWith('💡 ' + this.dataset.h)">💡 힌트</button>` : ''}</div></div>`;
      }).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn green" onclick="St.hintsToDraft()">📥 완성한 문장을 초안에 담기</button>
        <span class="small">빈칸을 다 채운 문장만 담겨요.</span></div>`;
  },
  blank(el) {
    const d = LS.get(this.k('hints')); if (!d) return;
    const s = +el.dataset.s, b = +el.dataset.b;
    d.values[s] = d.values[s] || []; d.values[s][b] = el.value;
    LS.set(this.k('hints'), d);
  },
  hintsToDraft() {
    const d = LS.get(this.k('hints')); if (!d) return;
    const done = [], skipped = [];
    d.sentences.forEach((s, si) => {
      const parts = s.template.split('____');
      const vals = d.values[si] || [];
      if (parts.length > 1 && parts.slice(0, -1).some((_, bi) => !String(vals[bi] || '').trim())) { skipped.push(si + 1); return; }
      done.push(parts.map((p, bi) => p + (bi < parts.length - 1 ? String(vals[bi]).trim() : '')).join('').replace(/\s+([.,!?])/g, '$1'));
    });
    if (!done.length) { toast('빈칸을 먼저 채워 주세요.', true); return; }
    const ta = $('#paper');
    if (ta.value.trim() && !confirm('초안 칸의 글을 완성한 문장들로 바꿀까요?')) return;
    ta.value = done.join(' ');
    this.onDraft();
    toast(skipped.length ? `빈칸이 남은 ${skipped.join(', ')}번 문장은 빼고 담았어요.` : '초안에 담았어요! 더 고치고 싶으면 직접 고쳐도 돼요.');
    ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },

  // 모르는 단어 찾기 (보기만, 직접 써요)
  async lookup() {
    const q = val('lk').trim(); if (!q) return;
    const out = $('#lkOut');
    await busy($('#lkBtn'), async () => {
      const r = await callApi('lookup', { ...this.creds(), query: q });
      out.innerHTML = r.items.length ? r.items.map((w) => `<div style="padding:8px 0;border-bottom:2px dashed #DCE8F2">
        <div class="row" style="gap:4px"><b class="en" style="font-size:1.25rem">${esc(w.word)}</b> <span>${esc(w.meaning)}</span>${sayBtn(w.word)}</div>
        <div class="en">${esc(w.example)} ${sayBtn(w.example)}</div></div>`).join('')
        : '<p>찾지 못했어요. 다른 말로 찾아볼까요?</p>';
    });
  },

  // 첨삭 받기
  async askFeedback(btn) {
    const text = $('#paper').value;
    if (wordCount(text) < 5) { toast('조금 더 써 봐요. 한두 문장 이상 써야 첨삭을 받을 수 있어요.', true); return; }
    const used = LS.get(this.kDay(), 0);
    if (used >= CONFIG.MAX_FEEDBACK_PER_DAY) { toast('오늘 첨삭은 모두 썼어요. 내일 다시 해요!', true); return; }
    await busy(btn, async () => {
      const r = await callApi('feedback', { ...this.creds(), text, mode: this.mode });
      LS.set(this.kDay(), used + 1);
      LS.set(this.km('fb'), { feedback: r.feedback, at: Date.now() });
      toast('첨삭이 왔어요! 아래에서 확인해요.');
      this.drawAfter();
      $('#secFb').scrollIntoView({ behavior: 'smooth' });
    });
    this.drawFbLeft();
  },

  // 첨삭 결과 → 다듬기 → 따라 쓰기 → 게시 (차례대로 아래로)
  drawAfter() {
    const fb = LS.get(this.km('fb'));
    const sec = (id, n, title, body) => { const el = $(`#${id}`); if (el) el.innerHTML = `<h3><span class="stepnum">${n}</span>${title}</h3>${body}`; el?.classList.toggle('locked', !fb); };
    if (!fb) {
      sec('secFb', this.num(2), '첨삭 결과 확인하기', '<p class="small">초안을 쓰고 <b>첨삭 받기</b>를 누르면 여기에 결과가 나와요.</p>');
      sec('secFinal', this.num(3), '완성 글 다듬기', '<p class="small">첨삭을 받은 다음 할 수 있어요.</p>');
      sec('secTyping', this.num(4), '따라 쓰기', '<p class="small">완성 글을 만든 다음 할 수 있어요.</p>');
      sec('secPost', this.num(5), '사진 넣고 게시판에 올리기', '<p class="small">따라 쓰기를 끝낸 다음 할 수 있어요.</p>');
      return;
    }
    const f = fb.feedback;
    sec('secFb', this.num(2), '첨삭 결과 확인하기', `<div class="split half">
      <div>${feedbackHtml(f)}</div>
      <div><h3>📄 고쳐 쓴 글 ${sayBtn(f.rewritten)}</h3><div class="paper-read" style="border:2px solid var(--leaf);border-radius:12px;padding:12px 16px">${esc(f.rewritten)}</div>
        <p class="small">다음 단계에서 이 글이나 내 초안을 가져와 다듬어요.</p></div></div>`);
    sec('secFinal', this.num(3), '완성 글 다듬기', `<div class="split wide">
      <textarea id="finalText" class="paper" spellcheck="false" autocomplete="off" oninput="St.onFinal()" placeholder="오른쪽 버튼으로 글을 가져와서 내 말로 다듬어요" aria-label="완성 글">${esc(LS.get(this.km('final'), ''))}</textarea>
      <div class="helper">
        <p class="small" style="margin-top:0">가져온 글을 읽어 보고, 내 생각이 잘 드러나게 다듬어요.</p>
        <div style="display:grid;gap:8px">
          <button class="btn" onclick="St.importFinal('rewrite')">📄 고쳐 쓴 글 가져오기</button>
          <button class="btn ghost" onclick="St.importFinal('draft')">📝 내 초안 가져오기</button>
          <button class="btn ghost sm" onclick="speak($('#finalText').value)">🔊 완성 글 듣기</button>
        </div>
      </div></div>`);
    this._tgt = null;
    this.drawTyping(); this.drawPost();
  },
  importFinal(kind) {
    const fb = LS.get(this.km('fb'));
    const text = kind === 'rewrite' ? fb?.feedback?.rewritten : $('#paper').value;
    if (!text) return;
    const ta = $('#finalText');
    if (ta.value.trim() && !confirm('완성 글 칸의 글이 바뀌어요. 가져올까요?')) return;
    ta.value = plain(text); this.onFinal(); ta.focus();
  },
  onFinal() { LS.set(this.km('final'), $('#finalText').value); this.drawTyping(); this.drawPost(); },
  finalText() { const t = $('#finalText'); return t ? t.value : LS.get(this.km('final'), ''); },

  // 따라 쓰기
  typedDone() { const t = typeNorm(this.finalText()); return !!t && LS.get(this.km('typed')) === t; },
  drawTyping() {
    const p = $('#secTyping'); if (!p || !LS.get(this.km('fb'))) return;
    const target = typeNorm(this.finalText());
    const head = `<h3><span class="stepnum">${this.num(4)}</span>따라 쓰기</h3>`;
    p.classList.toggle('locked', !target);
    if (!target) { p.innerHTML = head + '<p class="small">먼저 위에서 완성 글을 만들어요.</p>'; this._tgt = ''; return; }
    if (this.typedDone()) { p.innerHTML = head + '<div class="ok">👏 따라 쓰기를 끝냈어요! 이제 게시판에 올릴 수 있어요.</div>'; this._tgt = target; return; }
    if (this._tgt === target && $('#typing')) return;
    this._tgt = target;
    p.innerHTML = head + `<div class="split half">
      <div><p class="small" style="margin-top:0">완성한 글을 보면서 그대로 쳐 봐요. 대문자와 문장 부호도 똑같이 쳐요.</p>
        <div class="target" id="tgt">${esc(target)}</div></div>
      <div><textarea id="typing" class="paper" style="min-height:calc(2.4rem * 5 + 4px)" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
          onpaste="return false" ondrop="return false" oninput="St.onTyping()" placeholder="여기에 따라 쳐요 (복사·붙여넣기는 안 돼요)" aria-label="따라 쓰기"></textarea>
        <div class="row" style="margin-top:8px"><div class="bar grow"><i id="tbar"></i></div><b id="tpct">0%</b></div>
        <p class="small" id="tmsg" style="margin:6px 0 0"></p></div></div>`;
  },
  onTyping() {
    const target = this._tgt;
    const typed = plain($('#typing').value).replace(/\s+/g, ' ').replace(/^ /, '');
    let n = 0; while (n < typed.length && n < target.length && typed[n] === target[n]) n++;
    const bad = n < typed.length;
    $('#tgt').innerHTML = `<span class="done">${esc(target.slice(0, n))}</span>${bad && n < target.length ? `<span class="bad">${esc(target[n])}</span>${esc(target.slice(n + 1))}` : esc(target.slice(n))}`;
    const pct = Math.floor((n / target.length) * 100);
    $('#tbar').style.width = pct + '%'; $('#tpct').textContent = pct + '%';
    $('#tmsg').textContent = bad ? `빨간 글자부터 다시 확인해요. ${target[n] === ' ' ? '띄어쓰기' : `"${target[n] || ''}"`}를 쳐야 해요.` : '';
    if (n === target.length && typed.trim() === target) {
      LS.set(this.km('typed'), target);
      toast('따라 쓰기 완료! 👏');
      this.drawTyping(); this.drawPost();
    }
  },

  // 사진 + 게시판에 올리기
  drawPost() {
    const p = $('#secPost'); if (!p || !LS.get(this.km('fb'))) return;
    const ph = LS.get(this.km('photo'));
    const ready = this.typedDone();
    const posted = LS.get(this.km('posted'));
    p.classList.toggle('locked', !ready);
    p.innerHTML = `<h3><span class="stepnum">${this.num(5)}</span>사진 넣고 게시판에 올리기</h3>
    <div class="split half">
      <div>
        <p class="small" style="margin-top:0">사진은 넣지 않아도 돼요.</p>
        ${this.cfg.photo_search_enabled ? `<div class="row"><input type="search" id="ps" class="grow" placeholder="사진 찾기 예: soccer, pizza, 강아지" onkeydown="if(event.key==='Enter'&&!event.isComposing)St.photoSearch()">
          <button class="btn ghost" id="psBtn" onclick="St.photoSearch()">찾기</button></div>
          <div id="psOut" style="margin-top:8px"></div>` : ''}
        <div class="drop" tabindex="0" style="margin-top:10px;padding:12px" onpaste="St.pastePhoto(event)" aria-label="사진 붙여넣기 칸">
          <p style="margin:0 0 6px">${this.cfg.photo_search_enabled ? '찾는 사진이 없으면 ' : ''}내 사진 파일을 고르거나, 이 칸을 누르고 <b>Ctrl+V</b>로 붙여 넣어요.</p>

            <button class="btn red sm" onclick="St.clearPhoto()">사진 빼기</button></div></div>` : '<p class="small">고른 사진이 여기에 보여요.</p>'}
        ${posted ? '<div class="ok">✅ 게시판에 올렸어요! 글을 다시 다듬었다면 한 번 더 올리면 바뀌어요.</div>' : ''}
        <div class="row" style="margin-top:12px">
          <button class="btn big green" onclick="St.post(this)" ${ready ? '' : 'disabled'}>📌 게시판에 올리기</button>

        </div>
      </div>

    if (ph && ph.kind === 'file' && ph.path) {
      signedUrls([{ photo_path: ph.path }]).then((m) => { const img = $('#phPrev'); if (img && m[ph.path]) img.src = m[ph.path]; }).catch(() => {});
    }
  },
  async photoSearch() {
    const q = val('ps').trim(); if (!q) return;
    await busy($('#psBtn'), async () => {
      const r = await callApi('photo_search', { ...this.creds(), query: q });
      const out = $('#psOut');
      if (r.disabled) { out.innerHTML = '<p>지금은 사진 찾기를 쓸 수 없어요. 아래에서 내 사진을 올려 주세요.</p>'; return; }
      this._ps = r.results;
      out.innerHTML = r.results.length
        ? `<div class="photos">${r.results.map((x, i) => `<button onclick="St.choosePhoto(${i})" title="${attr(x.author)}"><img src="${attr(x.thumb)}" alt="${attr(x.alt)}" loading="lazy"></button>`).join('')}</div>`
        : '<p>사진을 찾지 못했어요. 영어로 찾아보거나, 아래에서 내 사진을 올려 주세요.</p>';

  choosePhoto(i) {
    const x = this._ps[i]; if (!x) return;
    LS.set(this.km('photo'), { kind: 'unsplash', url: x.url, thumb: x.thumb, credit: x.author, credit_link: x.author_link, download_location: x.download_location });
    this.drawPost(); toast('사진을 골랐어요.');
  },
  clearPhoto() { LS.del(this.km('photo')); this.drawPost(); },
  filePhoto(input) { if (input.files[0]) this.handleFile(input.files[0]); },
  pastePhoto(e) {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (!item) { toast('붙여 넣은 것 중에 사진이 없어요.', true); return; }
    e.preventDefault(); this.handleFile(item.getAsFile());
  },
  async handleFile(file) {
    if (!file.type.startsWith('image/')) { toast('사진 파일만 올릴 수 있어요.', true); return; }
    toast('사진을 올리는 중이에요…');
    try {
      const blob = await compressImage(file);
      const path = await uploadPhoto(this.me.class_code, this.me.no, blob);
      LS.set(this.km('photo'), { kind: 'file', path, thumb: '' });
      this.drawPost(); toast('사진을 올렸어요.');
    } catch (e) { toast(e.message, true); }
  },
  async post(btn) {
    if (!this.typedDone()) return;
    const ph = LS.get(this.km('photo'));
    const photo = !ph ? null : ph.kind === 'file' ? { path: ph.path } : { url: ph.url, credit: ph.credit, credit_link: ph.credit_link };
    await busy(btn, async () => {
      await rpc('student_post', { p_code: this.me.class_code, p_no: this.me.no, p_pin: this.me.pin, p_text: this.finalText(), p_photo: photo, p_mode: this.mode });

        callApi('photo_track', { download_location: ph.download_location }).catch(() => {});

      LS.set(this.km('posted'), true);
      toast('게시판에 올렸어요! 🎉');
      this.drawPost();
    });
  },

      <article class="card ${x.mine ? 'mine' : ''}">

        <div class="body">
          <p class="small" style="margin:0 0 4px">${x.student_no}번 ${esc(x.student_name)}${x.mine ? ' (나)' : ''} &nbsp;${esc(x.unit_name)}</p>

          <div class="row" style="margin-top:10px;gap:6px">
            <button class="heart ${x.liked ? 'on' : ''}" onclick="St.heart('${x.id}', this)" aria-pressed="${x.liked}">❤️ <span>${x.hearts}</span></button>
            ${sayBtn(x.final_text)}
            ${x.mine ? `<span class="grow"></span><button class="btn ghost sm" onclick="St.editPost('${x.id}')">✏️ 고치기</button><button class="btn red sm" onclick="St.deletePost('${x.id}', this)">삭제</button>` : ''}
          </div>
          ${x.mine && x.teacher_comment ? `<div class="note">🧑‍🏫 선생님 한마디: ${esc(x.teacher_comment)}</div>` : ''}
        </div>
      </article>`).join('')}</div>` : '<section class="panel flat"><p>아직 올라온 글이 없어요. 첫 번째로 글을 올려 볼까요?</p></section>';
  },
  editPost(id) {
    const x = this._gal.find((g) => g.id === id); const box = $(`#txt-${id}`); if (!x || !box) return;
    box.outerHTML = `<div id="txt-${id}"><textarea id="ed-${id}" rows="6" class="en" style="font-size:1.1rem">${esc(x.final_text)}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn sm green" onclick="St.saveEdit('${id}', this)">저장</button><button class="btn sm ghost" onclick="St.drawGallery()">취소</button></div></div>`;
  },
  async saveEdit(id, btn) {
    const text = val(`ed-${id}`);
    await busy(btn, async () => {
      await rpc('student_edit_post', { p_code: this.me.class_code, p_no: this.me.no, p_pin: this.me.pin, p_id: id, p_text: text });
      const x = this._gal.find((g) => g.id === id); if (x) x.final_text = text.trim();
      toast('고쳤어요.'); this.drawGallery();
    });
  },
  async deletePost(id, btn) {
    if (!confirm('게시판에서 내 글을 지울까요? (첨삭 기록은 내 포트폴리오에 남아요)')) return;
    await busy(btn, async () => {
      await rpc('student_delete_post', { p_code: this.me.class_code, p_no: this.me.no, p_pin: this.me.pin, p_id: id });
      const g = this._gal.find((x) => x.id === id);
      if (g) LS.del(this.k(`${g.write_mode || 'self'}:posted`));
      this._gal = this._gal.filter((x) => x.id !== id);
      toast('지웠어요.'); this.drawGallery();
    });
  },
  async heart(id, btn) {
    try {
      const r = await rpc('student_toggle_heart', { p_code: this.me.class_code, p_no: this.me.no, p_pin: this.me.pin, p_id: id });
      const g = this._gal.find((x) => x.id === id); if (g) { g.liked = r.liked; g.hearts = r.hearts; }
      btn.classList.toggle('on', r.liked); btn.setAttribute('aria-pressed', r.liked); btn.querySelector('span').textContent = r.hearts;
    } catch (e) { toast(e.message, true); }
  },

  // ---------- 5. 포트폴리오 ----------
  async renderMine(v) {
    v.innerHTML = '<section class="panel"><p><span class="spin"></span> 내 글을 불러오는 중…</p></section>';

      list = await rpc('student_portfolio', { p_code: this.me.class_code, p_no: this.me.no, p_pin: this.me.pin });

          <span class="badge ${x.write_mode === 'slow' ? 'slow' : 'self'}">${x.write_mode === 'slow' ? '🐢 천천히 쓰기' : '🚀 바로 쓰기'}</span>

        <div class="cols even" style="margin-top:10px">
          <div>
            <p class="small" style="margin:0">${x.posted ? '완성한 글' : '마지막 초안'}</p>
            <div class="paper-read">${esc(main)}</div>
            <div class="row">${sayBtn(main)}<span class="small">${fmtTime(x.updated_at)}</span></div>
            ${photoHtml(x, urls) ? `<div class="card" style="margin:8px 0 0;max-width:320px">${photoHtml(x, urls)}</div>` : ''}
            ${x.teacher_comment ? `<div class="note">🧑‍🏫 선생님 한마디: ${esc(x.teacher_comment)}</div>` : ''}
          </div>
          <div><details><summary>첨삭 다시 보기</summary>${feedbackHtml(x.feedback, { rewrite: true })}</details>
            ${typeNorm(x.original_text) !== typeNorm(x.draft_text) ? `<details style="margin-top:8px"><summary>처음 쓴 초안</summary><div class="paper-read">${esc(x.original_text)}</div></details>` : ''}</div>
        </div>
      </article>`;
      }).join('')}`;
  },
};
// =====================================================================
// 교사 모드 (/teacher)
// =====================================================================
const FIELDS = [
  ['unit_name', '단원 이름', 'input', '예: Unit 3. What subject do you like?'],
  ['topic', '쓰기 주제', 'input', '예: 내가 좋아하는 것 소개하기'],
  ['guide', 'AI 대화 가이드 (AI가 가장 먼저 따르는 틀이에요)', 'textarea', '예:\n1. 좋아하는 과목과 그 이유\n2. 좋아하는 음식\n3. 좋아하는 동물\n학생 답을 따라 고르기 → 이유 → 자세히 → 느낌 순서로 물어봐 주세요.'],
  ['key_expressions', '핵심 표현 (한 줄에 하나, 학생이 바꿔 쓸 부분은 괄호) — 한국어 해석은 학생 화면에 자동으로 붙어요', 'textarea', '예:\nI like ( ).\nI like it because ( ).'],
  ['words', '기억해 둘 단어 (한 줄에 하나, "단어 - 뜻")', 'textarea', '예:\nmath - 수학\nscience - 과학\ndelicious - 맛있는'],
  ['criteria', '평가 기준 (교사만 봐요)', 'textarea', '예:\n상: 핵심 표현을 바르게 쓰고 이유를 2가지 이상 씀\n중: 핵심 표현을 쓰고 이유를 1가지 씀\n하: 핵심 표현 사용이 부족함'],
];
function fieldsHtml(prefix, d, toggles) {
  return FIELDS.map(([k, label, type, ph]) => `
    <label for="${prefix}_${k}">${toggles ? `<input type="checkbox" id="${prefix}_on_${k}" aria-label="${label} 적용"> ` : ''}${label}</label>
    ${type === 'input'
      ? `<input type="text" id="${prefix}_${k}" value="${attr(d?.[k] || '')}" placeholder="${attr(ph)}">`
      : `<textarea id="${prefix}_${k}" rows="${k === 'guide' ? 6 : 4}" placeholder="${attr(ph)}">${esc(d?.[k] || '')}</textarea>`}`).join('');
}
function readFields(prefix, toggles) {
  const p = {};
  FIELDS.forEach(([k]) => {
    if (toggles && !document.getElementById(`${prefix}_on_${k}`).checked) return;
    p[k] = val(`${prefix}_${k}`).trim();
  });
  return p;
}
const classChecks = (name, classes, checked) => `<div class="checks">${classes.map((c) =>
  `<label><input type="checkbox" name="${name}" value="${attr(c.class_code)}" ${checked.includes(c.class_code) ? 'checked' : ''}> ${esc(c.class_code)}</label>`).join('')}</div>`;
const checkedValues = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((x) => x.value);
// 학년·반 고르기: "5학년 1반부터 4반까지"처럼 줄 단위로 고르고, 필요하면 학년 줄을 더해요
const _rows = {};
const clsLabel = (c) => `${c.grade}학년 ${c.class_no}반`;
function rangePicker(prefix) {
  _rows[prefix] = [{ grade: 5, from: 1, to: 1 }];
  return `<div id="${prefix}_rp" class="rangepick">${rangeRows(prefix)}</div>`;
}
function rangeRows(prefix) {
  const opts = (max, sel, unit) => Array.from({ length: max }, (_, i) => `<option value="${i + 1}" ${i + 1 === sel ? 'selected' : ''}>${i + 1}${unit}</option>`).join('');
  const rows = _rows[prefix];
  return rows.map((r, i) => `<div class="rp-row">
      <select aria-label="학년" onchange="rpSet('${prefix}',${i},'grade',this.value)">${opts(6, r.grade, '학년')}</select>
      <select aria-label="시작 반" onchange="rpSet('${prefix}',${i},'from',this.value)">${opts(15, r.from, '반')}</select><span>부터</span>
      <select aria-label="끝 반" onchange="rpSet('${prefix}',${i},'to',this.value)">${opts(15, r.to, '반')}</select><span>까지</span>
      <span class="rp-count">${r.to - r.from + 1}개 반</span>
      ${rows.length > 1 ? `<button type="button" class="iconbtn" aria-label="이 줄 지우기" onclick="rpDel('${prefix}',${i})">✕</button>` : ''}
    </div>`).join('') + `<button type="button" class="btn ghost sm" onclick="rpAdd('${prefix}')">＋ 다른 학년 추가</button>`;
}
function rpRender(prefix) { $(`#${prefix}_rp`).innerHTML = rangeRows(prefix); Te.previewCode(prefix); }
function rpSet(prefix, i, k, v) {
  const r = _rows[prefix][i]; r[k] = Number(v);
  if (k === 'from' && r.to < r.from) r.to = r.from;
  if (k === 'to' && r.to < r.from) r.from = r.to;
  rpRender(prefix);
}
function rpAdd(prefix) {
  const used = _rows[prefix].map((r) => r.grade);
  _rows[prefix].push({ grade: [5, 6, 4, 3, 2, 1].find((g) => !used.includes(g)) || 1, from: 1, to: 1 });

  return out.sort((a, b) => a.grade - b.grade || a.class_no - b.class_no);
}

  // ---------- 🖼️ 학급 게시판 ----------
  async renderBoard(v) {
    v.innerHTML = '<section class="panel"><p><span class="spin"></span> 불러오는 중…</p></section>';
    try {
      const all = await rpc('teacher_submissions', this.a({ p_target: this.target }));
      this._board = all.filter((x) => x.posted).sort((a, b) => String(b.posted_at).localeCompare(String(a.posted_at)));
      this._urls = await signedUrls(this._board);
    } catch (e) { v.innerHTML = `<div class="alert">${esc(e.message)}</div>`; return; }
    const units = [...new Set(this._board.map((x) => x.unit_name))];
    const cur = units.includes(this.cur().unit_name) ? this.cur().unit_name : '__all';
    v.innerHTML = `<section class="panel row" style="padding:10px 18px">
        <h2 class="grow" style="margin:0">🖼️ ${esc(clsLabel(this.cur()))} 게시판</h2>
        <span class="small">학생들이 보는 게시판과 같아요. 선생님은 모든 글을 고치거나 지울 수 있어요.</span>
        <select id="bdUnit" style="width:auto" onchange="Te.drawBoard()" aria-label="단원 고르기"><option value="__all">모든 단원</option>
          ${units.map((u) => `<option value="${attr(u)}" ${u === cur ? 'selected' : ''}>${esc(u || '단원 없음')}</option>`).join('')}</select>
      </section><div id="board"></div>`;
    this.drawBoard();
  },
  drawBoard() {
    const u = val('bdUnit');
    const list = this._board.filter((x) => u === '__all' || x.unit_name === u);
    $('#board').innerHTML = list.length ? `<div class="gallery">${list.map((x) => `
      <article class="card">
        ${photoHtml(x, this._urls)}
        <div class="body">
          <p class="small" style="margin:0 0 4px">${x.student_no}번 ${esc(x.student_name)} &nbsp;${esc(x.unit_name)} ${modeBadge(x.write_mode)}</p>
          <div class="paper-read" id="btxt-${x.id}">${esc(x.final_text)}</div>
          <div class="row" style="margin-top:10px;gap:6px">
            <span>❤️ ${x.hearts}</span>${sayBtn(x.final_text)}<span class="grow"></span>
            <button class="btn ghost sm" onclick="Te.editPost('${x.id}')">✏️ 고치기</button>
            <button class="btn red sm" onclick="Te.removePost('${x.id}', this)">삭제</button>
          </div>
        </div>
      </article>`).join('')}</div>` : '<section class="panel flat"><p>아직 게시판에 올라온 글이 없어요.</p></section>';
  },
  editPost(id) {
    const x = this._board.find((g) => g.id === id); const box = $(`#btxt-${id}`); if (!x || !box) return;
    box.outerHTML = `<div id="btxt-${id}"><textarea id="bed-${id}" rows="6" class="en" style="font-size:1.05rem">${esc(x.final_text)}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn sm green" onclick="Te.savePost('${id}', this)">저장</button><button class="btn sm ghost" onclick="Te.drawBoard()">취소</button></div></div>`;
  },
  async savePost(id, btn) {
    const text = val(`bed-${id}`);
    await busy(btn, async () => {
      await rpc('teacher_edit_post', this.a({ p_id: id, p_text: text }));
      const x = this._board.find((g) => g.id === id); if (x) x.final_text = text.trim();
      toast('고쳤어요.'); this.drawBoard();
    });
  },
  async removePost(id, btn) {
    if (!confirm('이 글을 게시판에서 지울까요? (첨삭 기록과 평가는 결과물 화면에 남아요)')) return;
    await busy(btn, async () => {
      await rpc('teacher_remove_post', this.a({ p_id: id }));
      this._board = this._board.filter((g) => g.id !== id);
      toast('지웠어요.'); this.drawBoard();
    });
  },
};
// =====================================================================
// 관리자 모드 (/admin) — 학생 글은 보지 않고 통계만
// =====================================================================
const Ad = {
  pin: null, tab: 'stats', stats: null,
  async init() {
    const s = SS.get('ew_admin');
    if (s) { this.pin = s; try { await rpc('admin_login', { p_pin: s }); return this.renderShell(); } catch { SS.del('ew_admin'); } }
    this.renderLogin();
  },
  renderLogin() {
    $('#app').innerHTML = `<div class="wrap" style="max-width:480px">
      <header class="top"><div class="brand">🛡️ 관리자</div><div class="row small"><a href="/">학생 화면</a><a href="/teacher">선생님 화면</a></div></header>
      <form class="panel" onsubmit="Ad.login(event)">
        <h2>관리자 로그인</h2>
        <label for="ad_pin">마스터 PIN</label><input type="password" id="ad_pin" required>
        <div style="margin-top:14px"><button class="btn big" id="ad_btn">로그인</button></div>
      </form></div>`;
  },
  async login(e) {
    e.preventDefault();
    await busy($('#ad_btn'), async () => {
      await rpc('admin_login', { p_pin: val('ad_pin') });
      this.pin = val('ad_pin'); SS.set('ew_admin', this.pin); this.renderShell();
    });
  },
  logout() { SS.del('ew_admin'); this.pin = null; this.renderLogin(); },
  a(x) { return { p_pin: this.pin, ...(x || {}) }; },

  renderShell() {
    $('#app').innerHTML = `<div class="wrap">
      <header class="top"><div class="brand">🛡️ 오늘의 영어 쓰기 <span class="muted small">관리자</span></div><button class="btn ghost sm" onclick="Ad.logout()">로그아웃</button></header>
      <nav class="tabs">${[['stats', '📊 통계'], ['classes', '🏫 학급'], ['requests', '📮 삭제·탈퇴 요청'], ['feedback', '📬 교사 의견'], ['bulk', '🧩 설정 일괄 적용'], ['config', '⚙️ 설정']].map(([id, n]) =>
        `<button class="tab ${this.tab === id ? 'on' : ''}" onclick="Ad.go('${id}')">${n}</button>`).join('')}</nav>
      <main id="aview"><section class="panel"><p><span class="spin"></span> 불러오는 중…</p></section></main></div>`;
    const v = $('#aview');
    ({ stats: () => this.vStats(v), classes: () => this.vClasses(v), requests: () => this.vRequests(v), feedback: () => this.vFeedback(v),
       bulk: () => this.vBulk(v), config: () => this.vConfig(v) })[this.tab]().catch((e) => { v.innerHTML = `<div class="alert">${esc(e.message)}</div>`; });
  },
  go(t) { this.tab = t; this.renderShell(); },

  async vStats(v) {
    const s = this.stats = await rpc('admin_stats', this.a());
    const mb = (b) => (b / 1024 / 1024).toFixed(1) + 'MB';
    const maxDay = Math.max(1, ...s.daily.map((d) => d.enter + d.chat + d.submit));
    const hours = Array.from({ length: 24 }, (_, h) => (s.hours.find((x) => x.hour === h) || { count: 0 }).count);
    const maxH = Math.max(1, ...hours);
    v.innerHTML = `
    <section class="panel"><h2>전체 현황</h2>
      <div class="tiles">
        <div class="tile"><b>${s.teachers}</b>교사</div><div class="tile"><b>${s.classes_count}</b>학급</div>
        <div class="tile"><b>${s.students}</b>학생</div><div class="tile"><b>${s.submissions}</b>제출</div>
        <div class="tile"><b>${s.hearts}</b>하트</div><div class="tile"><b>${mb(s.photo_bytes)}</b>사진 저장 용량</div>
        <div class="tile"><b>${mb(s.db_bytes)}</b>데이터베이스 용량</div>
      </div>
      <p class="muted small" style="margin-top:8px">Supabase 무료 등급은 보통 데이터베이스 500MB, 파일 저장소 1GB 정도예요. 요금제 한도는 Supabase 대시보드에서 확인해 주세요.</p>
    </section>
    <section class="panel"><h3>최근 14일 활동 (입장 + 대화 + 제출)</h3>
      <div class="bars" style="margin-bottom:26px">${s.daily.map((d) => { const t = d.enter + d.chat + d.submit; return `<div style="height:${(t / maxDay) * 100}%" title="${d.day}: 입장 ${d.enter}, 대화 ${d.chat}, 제출 ${d.submit}"><span>${d.day.slice(5)}</span></div>`; }).join('') || '<p class="muted">아직 기록이 없어요.</p>'}</div>
    </section>
    <section class="panel"><h3>시간대별 사용 (최근 14일, 한국 시간)</h3>
      <div class="bars" style="margin-bottom:26px">${hours.map((c, h) => `<div style="height:${(c / maxH) * 100}%;background:var(--pencil-dark)" title="${h}시: ${c}"><span>${h % 3 === 0 ? h + '시' : ''}</span></div>`).join('')}</div>
    </section>
    <section class="panel"><h3>학급별 통계</h3><div class="scroll"><table>
      <thead><tr><th>학급 코드</th><th>지금 단원</th><th>학생</th><th>예상</th><th>제출한 학생</th><th>제출률</th><th>제출</th><th>하트</th><th>AI 키</th><th>마지막 활동</th></tr></thead>
      <tbody>${s.classes.map((c) => {
        const base = c.expected || c.students;
        return `<tr><td>${esc(c.class_code)}</td><td>${esc(c.unit_name || '-')}</td><td>${c.students}</td><td>${c.expected || '-'}</td><td>${c.submitters}</td>
          <td>${base ? Math.round((c.submitters / base) * 100) + '%' : '-'}</td><td>${c.submissions}</td><td>${c.hearts}</td><td>${c.key_count}</td><td>${fmtTime(c.last_active)}</td></tr>`;
      }).join('')}</tbody></table></div>
      <p class="muted small">제출률 = 제출한 학생 수 ÷ 예상 학생 수 (예상 학생 수가 없으면 입장한 학생 수)</p>
    </section>`;
  },

  async vClasses(v) {
    const s = await rpc('admin_stats', this.a());
    v.innerHTML = `<section class="panel"><h2>학급 관리</h2><div class="scroll"><table>
      <thead><tr><th>학급 코드</th><th>학생</th><th>제출</th><th></th></tr></thead>
      <tbody>${s.classes.map((c) => `<tr><td>${esc(c.class_code)}</td><td>${c.students}</td><td>${c.submissions}</td>
        <td class="row" style="gap:6px"><button class="btn ghost sm" onclick="Ad.resetPins('${attr(c.class_code)}', this)">학생 PIN 모두 초기화</button>
        <button class="btn red sm" onclick="Ad.delClass('${attr(c.class_code)}', this)">학급 삭제</button></td></tr>`).join('')}</tbody></table></div></section>`;
  },
  async resetPins(code, btn) {
    if (!confirm(`${code} 학생들의 PIN을 모두 초기화할까요?`)) return;
    await busy(btn, async () => { await rpc('admin_reset_class_pins', this.a({ p_target: code })); toast('초기화했어요.'); });
  },
  async delClass(code, btn) {
    const typed = prompt(`학급과 학생 글이 모두 바로 지워져요. 되돌릴 수 없어요.\n확인을 위해 학급 코드를 그대로 적어 주세요:\n${code}`);
    if (typed !== code) { if (typed !== null) toast('학급 코드가 달라서 지우지 않았어요.', true); return; }
    await busy(btn, async () => { await rpc('admin_delete_class', this.a({ p_target: code })); toast('삭제했어요.'); this.renderShell(); });
  },

  async vRequests(v) {
    const list = await rpc('admin_requests', this.a());
    v.innerHTML = `<section class="panel"><h2>삭제·탈퇴 요청</h2>
      <p class="muted small">신청하고 3일이 지나야 승인할 수 있어요. 승인하면 되돌릴 수 없어요.</p>
      ${list.length ? `<div class="scroll"><table><thead><tr><th>종류</th><th>대상</th><th>신청 시각</th><th>상태</th><th></th></tr></thead><tbody>
      ${list.map((r) => {
        const until = new Date(new Date(r.requested_at).getTime() + 3 * 864e5);
        return `<tr><td>${r.kind === 'class' ? '학급 삭제' : '교사 탈퇴'}</td>
          <td>${r.teacher_name ? `<b>${esc(r.teacher_name)}</b> ` : ''}${r.kind === 'class' ? esc(r.class_code) : `교사 학급 ${r.teacher_classes.length}개: ${r.teacher_classes.map(esc).join(', ')}`}</td>
          <td>${fmtTime(r.requested_at)}</td><td>${r.ready ? '승인 가능' : `${fmtTime(until)}부터 승인 가능`}</td>
          <td class="row" style="gap:6px"><button class="btn green sm" ${r.ready ? '' : 'disabled'} onclick="Ad.decide('${r.id}', true, this)">승인</button>
          <button class="btn ghost sm" onclick="Ad.decide('${r.id}', false, this)">거절</button></td></tr>`;
      }).join('')}</tbody></table></div>` : '<p class="muted">처리할 요청이 없어요.</p>'}</section>`;
  },
  async decide(id, ok, btn) {
    if (!confirm(ok ? '승인하면 바로 지워지고 되돌릴 수 없어요. 승인할까요?' : '요청을 거절할까요?')) return;
    await busy(btn, async () => { await rpc('admin_decide', this.a({ p_id: id, p_approve: ok })); toast(ok ? '승인했어요.' : '거절했어요.'); this.renderShell(); });
  },

  async vFeedback(v) {
    const list = await rpc('admin_feedback', this.a());
    v.innerHTML = `<section class="panel"><h2>📬 선생님들이 보낸 의견</h2>
      ${list.map((f) => `<div style="padding:12px 0;border-bottom:1px solid #E1EBF3">
        <div class="row"><b class="grow">🏫 ${esc((f.schools || []).join(', ') || '학교 정보 없음')} 선생님</b><span class="small">${fmtTime(f.created_at)}</span>
          <button class="btn red sm" onclick="Ad.delFb('${f.id}', this)">삭제</button></div>
        <p class="small" style="margin:0">학급: ${(f.teacher_classes || []).map(esc).join(', ') || '(탈퇴한 교사)'}</p>
        <p style="margin:6px 0">${esc(f.message)}</p>
        ${f.reply ? `<div class="ok"><b>보낸 답장</b> <span class="small">${fmtTime(f.replied_at)}</span><br>${esc(f.reply)}</div>` : ''}
        <div class="row" style="margin-top:6px"><textarea id="rp-${f.id}" rows="2" class="grow" placeholder="답장 쓰기">${esc(f.reply || '')}</textarea>
          <button class="btn sm green" onclick="Ad.reply('${f.id}', this)">${f.reply ? '답장 고치기' : '답장 보내기'}</button></div>
      </div>`).join('') || '<p>받은 의견이 없어요.</p>'}</section>`;
  },
  async reply(id, btn) {
    await busy(btn, async () => { await rpc('admin_reply_feedback', this.a({ p_id: id, p_reply: val(`rp-${id}`) })); toast('답장을 보냈어요.'); this.renderShell(); });
  },
  async delFb(id, btn) {
    if (!confirm('이 의견을 지울까요?')) return;
    await busy(btn, async () => { await rpc('admin_delete_feedback', this.a({ p_id: id })); this.renderShell(); });
  },

  async vBulk(v) {
    const s = await rpc('admin_stats', this.a());
    v.innerHTML = `<section class="panel"><h2>학습 활동 설정 일괄 적용</h2>
      <p class="small">고른 학급에 <b>체크한 항목만</b> 똑같이 넣어요. (선생님들의 단원 목록은 바뀌지 않고, 학급의 지금 학습 내용만 바뀌어요.)</p>
      <label>학급</label>${classChecks('ab_cls', s.classes, [])}
      ${fieldsHtml('ab', {}, true)}
      <div style="margin-top:12px"><button class="btn big green" onclick="Ad.bulk(this)">적용하기</button></div></section>`;
  },
  async bulk(btn) {
    const targets = checkedValues('ab_cls'), patch = readFields('ab', true);
    if (!targets.length || !Object.keys(patch).length) { toast('학급과 항목을 골라 주세요.', true); return; }
    if (!confirm(`학급 ${targets.length}개에 적용할까요?`)) return;
    await busy(btn, async () => { const n = await rpc('admin_bulk_settings', this.a({ p_targets: targets, p_patch: patch })); toast(`학급 ${n}개에 적용했어요.`); });
  },

  async vConfig(v) {
    const c = await rpc('admin_get_config', this.a());
    v.innerHTML = `
    <section class="panel"><h2>교사 가입 코드</h2>
      <p>지금 코드: <b style="font-size:1.2rem">${esc(c.teacher_join_code)}</b></p>
      <div class="row"><input type="text" id="cf_join" class="grow" placeholder="새 가입 코드 (4자 이상)"><button class="btn" onclick="Ad.setCfg({teacher_join_code: val('cf_join').trim()}, this)">바꾸기</button></div>
    </section>
    <section class="panel"><h2>사진 검색 (Unsplash)</h2>
      <p>지금: <b>${c.photo_search_enabled ? '켜짐' : '꺼짐'}</b></p>
      <p class="muted small">꺼도 학생의 사진 파일 올리기·붙여넣기는 그대로 쓸 수 있어요. 넷리파이에 UNSPLASH_ACCESS_KEY가 없으면 켜도 검색 결과가 나오지 않아요.</p>
      <button class="btn ${c.photo_search_enabled ? 'red' : 'green'}" onclick="Ad.setCfg({photo_search_enabled: ${!c.photo_search_enabled}}, this)">${c.photo_search_enabled ? '사진 검색 끄기' : '사진 검색 켜기'}</button>
    </section>
    <section class="panel"><h2>마스터 PIN 바꾸기</h2>
      <div class="row"><input type="password" id="cf_p1" class="grow" placeholder="새 PIN (4자 이상)"><input type="password" id="cf_p2" class="grow" placeholder="한 번 더">
      <button class="btn" onclick="Ad.changePin(this)">바꾸기</button></div>
    </section>`;
  },
  async setCfg(p, btn) {
    await busy(btn, async () => { await rpc('admin_set_config', this.a({ p })); toast('바꿨어요.'); this.renderShell(); });
  },
  async changePin(btn) {
    const a = val('cf_p1'), b = val('cf_p2');
    if (a.length < 4 || a !== b) { toast('새 PIN을 4자 이상, 두 칸 똑같이 적어 주세요.', true); return; }
    await busy(btn, async () => {
      await rpc('admin_set_config', this.a({ p: { new_pin: a } }));
      this.pin = a; SS.set('ew_admin', a); toast('PIN을 바꿨어요.'); this.renderShell();
    });
  },
};

// =====================================================================
// 시작
// =====================================================================
(function start() {
  const path = location.pathname.replace(/\/+$/, '');
  const q = new URLSearchParams(location.search).get('mode');
  try {
    if (path.endsWith('/teacher') || q === 'teacher') Te.init();
    else if (path.endsWith('/admin') || q === 'admin') Ad.init();
    else St.init();
  } catch (e) {
    $('#app').innerHTML = `<div class="wrap"><div class="alert">${esc(e.message)}</div></div>`;
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
})();
</script>
